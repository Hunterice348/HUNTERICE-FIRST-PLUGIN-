name: Build HUNTERICE VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE
        shell: bash
        run: |
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target HUNTERICE_FIRST_PLUGIN_VST3

      - name: Locate VST3 bundle
        shell: bash
        run: |
          find build -type d -name "HUNTERICE First Plugin.vst3" -print -quit > vst3path.txt
          cat vst3path.txt

      - name: Package VST3 to ZIP
        shell: bash
        run: |
          VST3_PATH=$(cat vst3path.txt)
          if [ -z "$VST3_PATH" ]; then
            echo "VST3 bundle not found!"
            exit 1
          fi
          mkdir -p artifact
          cp -r "$VST3_PATH" artifact/
          cd artifact
          7z a ../HUNTERICE_First_Plugin_VST3.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUNTERICE_First_Plugin_VST3
          path: HUNTERICE_First_Plugin_VST3.zip
          if-no-files-found: error

name: Build HUNTERICE VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE 7.0.12
        shell: bash
        run: |
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -A x64

      - name: Build VST3 (Release)
        shell: bash
        run: |
          cmake --build build --config Release --target HUNTERICE_FIRST_PLUGIN_VST3

      - name: Locate VST3 bundle
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "HUNTERICE First Plugin.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Write-Error "VST3 bundle not found!"
            Get-ChildItem -Path build -Recurse | Format-Table FullName
            exit 1
          }
          Write-Host "Found VST3 at: $($vst3.FullName)"
          $vst3.FullName | Out-File -FilePath vst3path.txt -Encoding utf8

      - name: Package VST3 to ZIP
        shell: pwsh
        run: |
          $vst3Path = Get-Content vst3path.txt
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $vst3Path -Destination artifact -Recurse
          Compress-Archive -Path artifact\* -DestinationPath HUNTERICE_First_Plugin_VST3.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUNTERICE_First_Plugin_VST3
          path: HUNTERICE_First_Plugin_VST3.zip
          if-no-files-found: error
